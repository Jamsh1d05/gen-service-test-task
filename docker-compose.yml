x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://gen:gen@db:5432/gen
  WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}
  PROVIDER_TIMEOUT: ${PROVIDER_TIMEOUT:-60}
  PROVIDER_URLS: '{"alpha": "http://alpha:8000", "beta": "http://beta:8000"}'
  PUBLIC_BASE_URL: http://app:8000

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gen
      POSTGRES_PASSWORD: gen
      POSTGRES_DB: gen
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen -d gen"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Runs once and exits; the app starts only after migrations succeeded, so 4 workers
  # never race each other applying DDL.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment: *app-env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  alpha:
    build: .
    command: ["uvicorn", "fake_providers.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_NAME: alpha
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}
    ports:
      - "${ALPHA_PORT:-8001}:8000"

  beta:
    build: .
    command: ["uvicorn", "fake_providers.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PROVIDER_NAME: beta
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}
    ports:
      - "${BETA_PORT:-8002}:8000"

  # docker compose run --rm tests            -> integration tests against the compose DB
  # docker compose run --rm tests -m e2e     -> end-to-end against the running stack
  tests:
    build: .
    profiles: ["test"]
    entrypoint: ["pytest"]
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://gen:gen@db:5432/gen_test
      E2E_APP_URL: http://app:8000
      E2E_ALPHA_URL: http://alpha:8000
      E2E_BETA_URL: http://beta:8000
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-secret}
    depends_on:
      db:
        condition: service_healthy
